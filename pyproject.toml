[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "able-dialogue"
version = "1.0.0"
description = "Personalized disability support with politeness and empathy integration"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Kshitij Mishra"}, {name = "Manisha Burja"}, {name = "Asif Ekbal"}]
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.6,<3", "transformers>=4.48,<6", "peft>=0.14,<1", "accelerate>=1.2,<2", "numpy>=1.24,<3"]
eval = ["bert-score>=0.3.13,<0.4"]
plots = ["matplotlib>=3.7,<4"]
test = ["pytest>=8,<10"]

[project.scripts]
able = "able.cli:main"

[project.urls]
Repository = "https://github.com/Mishrakshitij/ABLE"
Paper = "https://aclanthology.org/2024.emnlp-main.1252/"

[tool.setuptools.packages.find]
where = ["src"]
